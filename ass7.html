<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 7 - DOM Manipulation</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f3f6ff, #eafaf1);
      color: #1d2736;
    }

    .container {
      max-width: 1100px;
      margin: 50px auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 30px;
    }

    .panel {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 18px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
      padding: 24px;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 1.8rem;
      color: #1d4ed8;
    }

    #todo-form {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
    }

    #todo-input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 1rem;
    }

    #todo-form button,
    .remove-btn {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    #todo-form button {
      background: #2563eb;
      color: white;
    }

    .remove-btn {
      background: #ef4444;
      color: white;
      padding: 8px 12px;
      font-size: 0.85rem;
    }

    #todo-form button:hover,
    .remove-btn:hover,
    .thumb-btn:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    #todo-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #todo-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px 14px;
    }

    #todo-list li span {
      flex: 1;
      word-break: break-word;
      font-size: 1rem;
    }

    .gallery {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    #main-image {
      width: 100%;
      height: 340px;
      object-fit: cover;
      border-radius: 16px;
      border: 3px solid #dbeafe;
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.08);
    }

    .thumbnails {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .thumb-btn {
      border: 2px solid transparent;
      background: transparent;
      padding: 0;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .thumb-btn.active {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .thumb-btn img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="panel">
      <h2>To-Do List</h2>
      <form id="todo-form">
        <input id="todo-input" type="text" placeholder="Add a new task" aria-label="Add a new task" />
        <button type="submit">Add</button>
      </form>
      <ul id="todo-list"></ul>
    </section>

    <section class="panel">
      <h2>Image Gallery</h2>
      <div class="gallery">
        <img id="main-image" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80" alt="Forest lake scenery" />

        <div class="thumbnails">
          <button class="thumb-btn active" type="button" data-image="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80" data-alt="Forest lake scenery">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=400&q=80" alt="Forest lake scenery thumbnail" />
          </button>

          <button class="thumb-btn" type="button" data-image="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=1200&q=80" data-alt="Mountain landscape">
            <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=400&q=80" alt="Mountain landscape thumbnail" />
          </button>

          <button class="thumb-btn" type="button" data-image="https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=1200&q=80" data-alt="Sunrise over the ocean">
            <img src="https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=400&q=80" alt="Sunrise over the ocean thumbnail" />
          </button>

          <button class="thumb-btn" type="button" data-image="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1200&q=80" data-alt="Green valley view">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=400&q=80" alt="Green valley view thumbnail" />
          </button>

          <button class="thumb-btn" type="button" data-image="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80" data-alt="Hills and clouds">
            <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=400&q=80" alt="Hills and clouds thumbnail" />
          </button>

          <button class="thumb-btn" type="button" data-image="https://images.unsplash.com/photo-1501854140801-50d01698950b?auto=format&fit=crop&w=1200&q=80" data-alt="Waterfall in the forest">
            <img src="https://images.unsplash.com/photo-1501854140801-50d01698950b?auto=format&fit=crop&w=400&q=80" alt="Waterfall in the forest thumbnail" />
          </button>
        </div>
      </div>
    </section>
  </div>

  <script>
    const todoForm = document.getElementById('todo-form');
    const todoInput = document.getElementById('todo-input');
    const todoList = document.getElementById('todo-list');

    function addTodoItem(taskText) {
      const listItem = document.createElement('li');
      const text = document.createElement('span');
      const removeButton = document.createElement('button');

      text.textContent = taskText;
      removeButton.type = 'button';
      removeButton.textContent = 'Remove';
      removeButton.className = 'remove-btn';

      removeButton.addEventListener('click', function () {
        listItem.remove();
      });

      listItem.appendChild(text);
      listItem.appendChild(removeButton);
      todoList.appendChild(listItem);
    }

    todoForm.addEventListener('submit', function (event) {
      event.preventDefault();
      const taskText = todoInput.value.trim();

      if (!taskText) {
        todoInput.focus();
        return;
      }

      addTodoItem(taskText);
      todoInput.value = '';
      todoInput.focus();
    });

    const mainImage = document.getElementById('main-image');
    const thumbnailButtons = document.querySelectorAll('.thumb-btn');

    thumbnailButtons.forEach(function (button) {
      button.addEventListener('click', function () {
        const newImage = button.dataset.image;
        const newAlt = button.dataset.alt;

        mainImage.src = newImage;
        mainImage.alt = newAlt;

        thumbnailButtons.forEach(function (thumb) {
          thumb.classList.toggle('active', thumb === button);
        });
      });
    });
  </script>
</body>
</html>
